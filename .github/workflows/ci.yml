name: CI — Lint, Tests, Scanner

on:
  push:
    branches: [main, security-fix, security-integrity-followup]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: al_asafy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, json

      - name: PHP Lint
        run: find . -name "*.php" -not -path "./vendor/*" | xargs -n1 php -l

      - name: Install Composer Dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist
          fi

      - name: Apply Schema
        run: mysql -h 127.0.0.1 -u root -ptesting al_asafy_test < sql/schema.sql
        env:
          MYSQL_PWD: testing

      - name: Apply Migrations
        run: |
          for f in sql/migrations/*.sql; do
            echo "Applying $f..."
            mysql -h 127.0.0.1 -u root -ptesting al_asafy_test < "$f"
          done
        env:
          MYSQL_PWD: testing

      - name: Run Integration Tests
        run: php tests/security_and_workflows_test.php
        env:
          APP_ENV: testing
          ASAFY_ALLOW_DB_TESTS: "1"
          DB_HOST: 127.0.0.1
          DB_NAME: al_asafy_test
          DB_USER: root
          DB_PASS: testing

      - name: Run Static Scanner
        run: php tests/static_financial_bypass_scan.php
